<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .banner-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; fill: #0F172A; }
        .banner-subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 22px; fill: #1E293B; }
        .banner-desc { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: 16px; fill: #475569; }
    </style>

    <!-- Outer Rounded Card Background -->
    <rect width="1200" height="300" rx="24" fill="url(#bg-gradient)" stroke="#BFDBFE" stroke-width="1.5"/>

    <!-- Background City Skyline Silhouette -->
    <g opacity="0.18">
        <path d="M0 300 V230 H40 V180 H70 V230 H110 V140 H150 V230 H200 V120 H250 V230 H300 V190 H340 V230 H390 V90 H440 V230 H500 V160 H550 V230 H610 V110 H670 V230 H720 V170 H770 V230 H830 V80 H890 V230 H940 V150 H1000 V230 H1060 V100 H1120 V230 H1200 V300 Z" fill="#2563EB"/>
    </g>

    <!-- Left Content Text -->
    <g transform="translate(60, 95)">
        <text x="0" y="0" class="banner-title">Welcome Back!</text>
        <text x="0" y="42" class="banner-subtitle">Login to your Agent 24 India account</text>
        <text x="0" y="80" class="banner-desc">Access your dashboard, manage your listings and grow your business.</text>
    </g>

    <!-- Right Content Illustration Group -->
    <g transform="translate(720, 30)">

        <!-- 3D Security Shield -->
        <g transform="translate(0, 45)" filter="url(#shield-shadow)">
            <!-- Outer Shield Body -->
            <path d="M45 5 L82 22 V54 C82 80 45 104 45 104 C45 104 8 80 8 54 V22 L45 5 Z" fill="url(#shield-gradient)"/>
            <!-- Inner Bezel -->
            <path d="M45 11 L75 25 V52 C75 73 45 94 45 94 C45 94 15 73 15 52 V25 L45 11 Z" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
            <!-- White Lock Icon -->
            <rect x="31" y="49" width="28" height="22" rx="4" fill="#FFFFFF"/>
            <path d="M36 49 V40 C36 35 40 31 45 31 C50 31 54 35 54 40 V49" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <circle cx="45" cy="58" r="3" fill="#0038A8"/>
            <path d="M45 61 V66" stroke="#0038A8" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Laptop Dashboard Mockup -->
        <g transform="translate(75, 10)" filter="url(#laptop-shadow)">
            <!-- Laptop Body / Screen Shell -->
            <rect x="25" y="10" width="280" height="175" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
            <rect x="30" y="15" width="270" height="165" rx="6" fill="#FFFFFF"/>

            <!-- Header Nav Bar -->
            <rect x="30" y="15" width="270" height="22" fill="#004BEE"/>
            <circle cx="42" cy="26" r="3.5" fill="#FFFFFF"/>
            <circle cx="53" cy="26" r="3.5" fill="rgba(255,255,255,0.7)"/>
            <circle cx="64" cy="26" r="3.5" fill="rgba(255,255,255,0.7)"/>

            <!-- Sidebar -->
            <rect x="30" y="37" width="50" height="143" fill="#0A2540"/>
            <rect x="36" y="46" width="38" height="5" rx="2.5" fill="#0066FF"/>
            <rect x="36" y="58" width="30" height="4" rx="2" fill="#475569"/>
            <rect x="36" y="68" width="34" height="4" rx="2" fill="#475569"/>
            <rect x="36" y="78" width="26" height="4" rx="2" fill="#475569"/>
            <rect x="36" y="88" width="32" height="4" rx="2" fill="#475569"/>

            <!-- Main Content Display -->
            <!-- Donut Chart Widget -->
            <rect x="90" y="46" width="200" height="60" rx="6" fill="#FAFCFF" stroke="#E2E8F0"/>
            <circle cx="125" cy="76" r="18" stroke="#004BEE" stroke-width="6" fill="none"/>
            <circle cx="125" cy="76" r="18" stroke="#FFB800" stroke-width="6" stroke-dasharray="30 100" fill="none"/>
            <rect x="155" y="60" width="70" height="7" rx="3.5" fill="#1E293B"/>
            <rect x="155" y="74" width="110" height="6" rx="3" fill="#94A3B8"/>

            <!-- Bar Chart Widget -->
            <rect x="90" y="114" width="200" height="60" rx="6" fill="#FAFCFF" stroke="#E2E8F0"/>
            <rect x="105" y="140" width="10" height="26" rx="2" fill="#BFDBFE"/>
            <rect x="120" y="128" width="10" height="38" rx="2" fill="#004BEE"/>
            <rect x="135" y="134" width="10" height="32" rx="2" fill="#60A5FA"/>
            <rect x="150" y="122" width="10" height="44" rx="2" fill="#004BEE"/>
            <rect x="165" y="144" width="10" height="22" rx="2" fill="#BFDBFE"/>
            <rect x="180" y="126" width="10" height="40" rx="2" fill="#2563EB"/>
            <rect x="195" y="120" width="10" height="46" rx="2" fill="#004BEE"/>

            <!-- Laptop Base Deck & Hinge -->
            <path d="M10 185H320L330 196C330 198 327 200 320 200H20C13 200 10 198 10 196L10 185Z" fill="#94A3B8"/>
            <path d="M13 185H317L323 194H17L13 185Z" fill="#CBD5E1"/>
            <path d="M140 186H190V189C190 191 187 192 184 192H146C143 192 140 191 140 189V186Z" fill="#64748B"/>
        </g>

        <!-- Plant Pot -->
        <g transform="translate(370, 140)">
            <path d="M12 40L15 62H29L32 40H12Z" fill="#FFFFFF" stroke="#E2E8F0"/>
            <path d="M10 37H34V41H10V37Z" fill="#E2E8F0"/>
            <path d="M22 38V15" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M22 30C17 27 12 27 9 29C12 23 19 23 22 30Z" fill="#16A34A"/>
            <path d="M22 25C27 22 32 22 35 24C32 18 25 18 22 25Z" fill="#22C55E"/>
            <path d="M22 20C16 16 11 17 8 20C12 12 19 13 22 20Z" fill="#15803D"/>
            <path d="M22 15C28 11 33 12 36 15C32 7 25 8 22 15Z" fill="#22C55E"/>
        </g>
    </g>

    <!-- Definitions & Gradients -->
    <defs>
        <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EFF6FF"/>
            <stop offset="0.5" stop-color="#DBEAFE"/>
            <stop offset="1" stop-color="#EBF4FE"/>
        </linearGradient>

        <linearGradient id="shield-gradient" x1="8" y1="5" x2="82" y2="104" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2563EB"/>
            <stop offset="0.5" stop-color="#004BEE"/>
            <stop offset="1" stop-color="#002D8B"/>
        </linearGradient>

        <filter id="shield-shadow" x="-10" y="-5" width="110" height="130" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#004BEE" flood-opacity="0.3"/>
        </filter>

        <filter id="laptop-shadow" x="10" y="-5" width="330" height="220" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15"/>
        </filter>
    </defs>
</svg>
